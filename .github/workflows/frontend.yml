name: React Vite CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build React Vite
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React Vite
        run: npm run build

  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_frontend:latest

  deploy:
    name: Deploy to OKE
    runs-on: ubuntu-24.04
    needs: publish
    if: github.event_name != 'pull_request'

    steps:
      - name: Configure kubectl for OKE
        uses: oracle-actions/configure-kubectl-oke@v1.5.0
        with:
          cluster: ${{ secrets.OKE_CLUSTER_OCID }}
          # Ajout des configurations obligatoires pour l'action Oracle
          user: ${{ secrets.OCI_CLI_USER }}
          tenancy: ${{ secrets.OCI_CLI_TENANCY }}
          fingerprint: ${{ secrets.OCI_CLI_FINGERPRINT }}
          region: ${{ secrets.OCI_CLI_REGION }}
          user_private_key: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          # Ajout de la clé de déchiffrement pour la clé PEM chiffrée
          user_private_key_passphrase: ${{ secrets.OCI_CLI_KEY_PASSPHRASE }}

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Update frontend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/hospitalisation_frontend \
            frontend="${DOCKERHUB_USERNAME}/gestion_hospitalisation_frontend:${IMAGE_TAG}" \
            -n hospitalisation

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hospitalisation_frontend \
            -n hospitalisation --timeout=180s