
name: React Vite CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build React Vite
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React Vite
        run: npm run build

  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_frontend:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_frontend:latest

  deploy:
    name: Deploy to Oracle Kubernetes Engine
    runs-on: ubuntu-24.04
    needs: publish
    if: github.event_name != 'pull_request'

    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}

    steps:
      - name: Configure kubectl for OKE
        uses: oracle-actions/configure-kubectl-oke@v1.5.0
        with:
          cluster: ${{ secrets.OKE_CLUSTER_OCID }}

      - name: Verify OKE connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Update frontend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/hospitalisation-frontend \
            frontend="docker.io/${DOCKERHUB_USERNAME}/gestion_hospitalisation_frontend:${IMAGE_TAG}" \
            -n hospitalisation

      - name: Verify frontend deployment
        run: |
          kubectl rollout status deployment/hospitalisation-frontend \
            -n hospitalisation --timeout=180s
          kubectl get pods -n hospitalisation
