name: React Vite CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build React Vite
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React Vite
        run: npm run build

  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_frontend:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_frontend:latest

  update-manifest:
    name: Update Kubernetes Manifest for Argo CD
    runs-on: ubuntu-24.04
    needs: publish
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update frontend image in Kubernetes manifest
        run: |
          sed -i "s|image: .*gestion_hospitalisation_frontend:.*|image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_frontend:${{ github.sha }}|" kubernetes/frontend/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/hospitalisation-frontend \
            frontend=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_frontend:${{ github.sha }} \
            -n hospitalisation


      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/frontend/deployment.yaml
          git commit -m "chore: update frontend image to ${{ github.sha }}" || echo "No changes to commit"
          git push
